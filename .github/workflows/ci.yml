name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets the job request a GitHub OIDC token
    env:
      REGION: europe-west2
      IMAGE: europe-west2-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/titanic/titanic-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (including training extras)
        run: uv sync --frozen --extra train

      - name: Train a model
        run: uv run python -m titanic.train

      - name: Build image
        run: docker build --platform linux/amd64 -t titanic-api .

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 titanic-api
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Pclass": 1, "Sex": "female", "SibSp": 0, "Parch": 0}'
          docker logs api

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: google-github-actions/setup-gcloud@v3

      - name: Push image to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker tag titanic-api ${IMAGE}:${{ github.sha }}
          docker tag titanic-api ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: Deploy to Cloud Run
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gcloud run deploy titanic-api \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --region ${REGION} \
            --image ${IMAGE}:${{ github.sha }} \
            --service-account titanic-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --port 8000 \
            --memory 512Mi \
            --max-instances 2

      - name: Check the live service
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          URL=$(gcloud run services describe titanic-api \
            --project ${{ vars.GCP_PROJECT_ID }} --region ${REGION} \
            --format='value(status.url)')
          echo "Live at: ${URL}/docs" >> $GITHUB_STEP_SUMMARY
          curl -sf --retry 5 --retry-delay 5 --retry-all-errors "${URL}/health"
          curl -sf -X POST "${URL}/predict" \
            -H "Content-Type: application/json" \
            -d '{"Pclass": 1, "Sex": "female", "SibSp": 0, "Parch": 0}'