[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-mlops"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "joblib==1.3.2",
    "numpy==1.26.4",
]

[project.optional-dependencies]
train = ["kagglehub==1.0.2", "mlflow==3.17.1"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]