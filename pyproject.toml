[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "joblib==1.3.2",
    "numpy==1.26.4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.54.0,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
train = ["kagglehub==1.0.2", "mlflow==3.17.1"]

[dependency-groups]
dev = ["pytest", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]